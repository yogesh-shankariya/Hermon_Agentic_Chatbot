llm:
  max_retries: 2

  # Generic SQL agent config. By default, enabled skills come from
  # app/skills/registry.yaml; set enabled_skills to a YAML list to restrict
  # production to a subset.
  sql_agent:
    Model: "gpt-5.4"
    # reasoning:
    #   effort: "xhigh"
    prompt_cache_key: "hermon_sql_agent_v1"
    prompt_cache_retention: "24h"
    max_tool_rows: 20
    enabled_skills: "all"

database:
  # The chatbot must connect only through Hermon's configured read-only org URL.
  # Do not add DATABASE_URL or any fallback database URL here.
  default_org_id_env: "HERMON_DEFAULT_CLERK_ORG_ID"
  max_rows_env: "HERMON_SQL_MAX_ROWS"
  timeout_ms_env: "HERMON_SQL_TIMEOUT_MS"
  max_rows: 500
  timeout_ms: 10000
  require_org_scope: true

organization_timezones:
  default_timezone: "UTC"
  by_org_id:
    org_3ARuGHeqbbEu5FNexlpC7ElaiyW: "Europe/Amsterdam"

prompts:
  base_path: "app/prompts"
  router_path: "router"
  sql_agent_path: "sql_agent"
  sql_answer_path: "sql_answer"

  # Prompt files are versioned as app/prompts/<agent>/<version>.md.
  router:
    version: "1_0_0"

  sql_agent:
    version: "1_0_0"

  sql_answer:
    version: "1_0_0"

skills:
  base_path: "app/skills/modules"

  # Skill instruction files are versioned as
  # app/skills/modules/<skill>/<version>.md.
  lead_analytics:
    path: "lead_analytics"
    version: "1_0_0"

  appointment_analytics:
    path: "appointment_analytics"
    version: "1_0_0"

  acquisition_analytics:
    path: "acquisition_analytics"
    version: "1_0_0"

  lead_profile_analytics:
    path: "lead_profile_analytics"
    version: "1_0_0"

  revenue_analytics:
    path: "revenue_analytics"
    version: "1_0_0"

  lead_360:
    path: "lead_360"
    version: "1_0_0"

  diagnostic_analytics:
    path: "diagnostic_analytics"
    version: "1_0_0"
