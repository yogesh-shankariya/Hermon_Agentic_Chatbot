llm:
  max_retries: 2

  # Generic SQL agent config. By default, enabled skills come from
  # app/skills/registry.yaml; set enabled_skills to a YAML list to restrict
  # production to a subset.
  sql_agent:
    Model: "gpt-5.4"
    reasoning:
      effort: "xhigh"
    prompt_cache_key: "hermon_sql_agent_v1"
    prompt_cache_retention: "24h"
    max_tool_rows: 20
    enabled_skills: "all"

database:
  # Environment variable names are configurable so deployments can reuse this
  # package without changing code.
  url_env: "HERMON_DATABASE_URL"
  fallback_url_env: "DATABASE_URL"
  default_org_id_env: "HERMON_DEFAULT_CLERK_ORG_ID"
  max_rows_env: "HERMON_SQL_MAX_ROWS"
  timeout_ms_env: "HERMON_SQL_TIMEOUT_MS"
  max_rows: 500
  timeout_ms: 10000
  require_org_scope: true

prompts:
  base_path: "app/prompts"

  # Prompt files are versioned as app/prompts/<agent>/<version>.yaml.
  sql_agent:
    version: "1_0_0"

testing:
  silver_truth:
    # Flex is lower cost but slower and can be unavailable; keep production on
    # the default service tier by leaving llm.sql_agent.service_tier unset.
    # Set to "default" to use normal processing instead of flex.
    service_tier: "flex"
