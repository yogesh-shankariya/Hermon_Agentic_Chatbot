llm:
  max_retries: 2

  # Generic SQL agent config. Add future SQL skills under enabled_skills;
  # do not create a new prompt for every skill unless behavior truly diverges.
  sql_agent:
    Model: "gpt-5.4"
    max_tool_rows: 50
    enabled_skills:
      - "lead_analytics"

database:
  # Environment variable names are configurable so deployments can reuse this
  # package without changing code.
  url_env: "HERMON_DATABASE_URL"
  fallback_url_env: "DATABASE_URL"
  default_org_id_env: "HERMON_DEFAULT_CLERK_ORG_ID"
  max_rows_env: "HERMON_SQL_MAX_ROWS"
  timeout_ms_env: "HERMON_SQL_TIMEOUT_MS"
  max_rows: 500
  timeout_ms: 10000
  require_org_scope: true

prompts:
  base_path: "app/prompts"

  # Prompt files are versioned as app/prompts/<agent>/<version>.yaml.
  sql_agent:
    version: "1_0_0"
